  - name: Nicole Selley
    stars: 5
    text: "I've had my car detailed MANY times by Andrew & let me just say this, he NEVER disappoints. I have a white SUV and live in florida, so you already know how hard it is to keep a white car clean between rain, dirt, pollen, and yes, 3 kids, yet he always has my car looking like I just pulled it out of the GMC parking lot. Shiny and brand new! He pays attention to every little detail whether it's the inside or outside, so if you're looking to get your vehicle detailed he's definitely the go to person for the job! Big or small. I'll never go anywhere else to get my car detailed."

  - name: colton craine
    stars: 5
    text: "Shows up on time excellent work makes cars look new again would highly recommend we will be using for years to come!!!!!"

  - name: Kristina Selley
