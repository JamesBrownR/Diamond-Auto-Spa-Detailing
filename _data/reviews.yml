    text: "He does an amazing job detailing cars & makes sure you're happy with it."

  - name: Pool Gator pool service
    stars: 5
    text: "Andrew is the best vehicle detailer I have ever had. He has been doing our cars, boat, and Harley for at least a year now. He is very reliable and very detailed oriented. He has great communication with us and has aways given us a fair price. Give him a call, you won't be disappointed."

  - name: Mike G
    stars: 5
