  - name: Blake Griffin
    stars: 5
    text: "Andrew and his company were very professional, and personable. He communicated the pricing and the extent of the work being done had consisted of. He's the only one I trust to work on mine and my wife's vehicles. 100% recommend, Always does an amazing job, this young man is going places!"
