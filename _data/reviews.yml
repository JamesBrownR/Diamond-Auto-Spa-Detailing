reviews:
  - name: Kevin Daniels
    stars: 5
    text: "Fantastic job! Andrew went above and beyond, and I highly recommend him!"

  - name: Roxanna Wright
    stars: 5
    text: "Diamond Auto Spa does AMAZING work! Our Jeep Grand Cherokee looks like it just rolled off the Showroom. Brilliant shine and gleaming interior. Andrew is very meticulous not missing any detail.♥️"

  - name: Bill Olsen
    stars: 5
    text: "My name is Bill Olsen and I have a 1972 Nova that I've owned for 12 years. Diamond auto spa came to my house today and detailed it. I'm having a hard time coming up with the right words to do the job justice. The car looks amazing. Better than it's EVER looked. They were here for a solid 8 hours and didn't miss anything. The car literally looks brand new. If you want your classic car show ready I would highly recommend them. If they can make 22 year old paint look new I can't imagine what they can do with a modern car. Check the website. You will not regret it. I've worked with several other retailers in the past and none of them even came close."

  - name: Cate Shanahan
    stars: 5
    text: "Me and my car are much happier now I no longer have to drive with shame I can drive with shine. Seriously though he does meticulous work and is very thoughtful and courteous and explains everything thoroughly. Exceeded expectations. He clearly loves cars and it shows"

  - name: Justin Long
    stars: 5
    text: "Diamond Auto Spa did an excellent job on my Ford F150 Police Interceptor. I called him last minute and he was able to fit in a time for my detail just before my annual inspection. Was on time with a reasonable price for last minute. Would recommend!"

  - name: Deez Kutz
    stars: 5
    text: "Attention to detail. Best service ever period!"

  - name: Bob Schilling
    stars: 5
    text: "Andrew did a great job, truck looked like new again!"

  - name: Colin
    stars: 5
    text: "Andrew did a great job. Had a tough issue with my Type R's windshield due to my mistake and after having him come out to try and fix it, my windshield is in a MUCH better state than it was before. He also gave the whole car a wash afterwards and it looks great! I thoroughly recommend giving him a chance if you need any detail work done on your vehicle."

  - name: Yours Truly
    stars: 5
    text: "I'm Pretty New To This Area And One Of The Reasons I Booked Is Due To The Wonderful Reviews I Read About The Job Andrew Does. I Own A Pretty Big SUV And Andrew Took His Entire Day To Make Sure That I Could Have A Vehicle That Would Make Me Proud And Happy, Inside And Out! He Really Does Go The Extra Mile For His Customers And I'm Glad This Is His Calling! Needless To Say I Will Definitely Book Again And Would Definitely Recommend! 10/10"

  - name: Brittany Furse
    stars: 5
    text: "Andrew surpassed all my expectations! I have two small kids so I'm sure you can imagine how awful it was before. He took the time to get EVERY nook and cranny so you would never think that my kids are as messy as they are. He shampooed my seats and got all the stains out - I couldn't even tell you how many things had been spilled back there. I figured they would still be stained but at least look better than beforehand. When I went out to check everything at the end, I was shocked!!!! Needless to say that my car now has a no eating policy. I will be recommending Andrew to everyone. Trust me… worth every penny! Thank you Andrew for providing service and results beyond what I was hoping for!"

  - name: Pierre Nimmer
    stars: 5
    text: "Andrew did an excellent job detailing both of my vehicles. They look brand new show room condition. He also fixed a paint chip on my truck, repainted the baja lights from weather damage, and repainted rusty screws in the baja rack. He is by far the best detailer i found in central Florida. He spent 4hrs on my suv, and 9hrs on my truck. Both look brand new. I think he charges a fair price and delivers +A quality work. I have hired cheaper auto detailers but they did poor work in 1-2hrs per vehicle and it was not worth the money. I think you will be very happy with Andrew."

  - name: B Thompson
    stars: 5
    text: "Absolutely earned a five-star review! Great communication, showed on time, understood and explained the scope of work, and worked for SEVEN HOURS to have my truck looking better than showroom new! I'm so glad to once again have an experienced professional I can trust to take care of my automobile. Looking forward to monthly maintenance, too. Thanks, Andrew! #GatorTundra"

  - name: Nolan White
    stars: 5
    text: "Excellent work and excellent customer service."

  - name: Jolene Coates
    stars: 5
    text: "I couldn't be more impressed with the exceptional service from this new to me car detailer! My red SUV has truly never looked better—every inch is spotless, and the shine is unbelievable. Andrew's attention to detail and professionalism far exceeded my expectations. Highly recommend to anyone wanting their car to look brand-new again!"

  - name: chris c
    stars: 5
    text: "Amazing! I've had my truck for 7 years now and I've had multiple professional details done over the years and can say with 100% confidence that Andrew is by far the best!! I feel like I just bought a new truck! Thanks again"

  - name: Alysha Knapp
    stars: 5
    text: "Diamond Auto Spa Detailing did an excellent job on my car's interior! Their mobile service came right to my workplace, which made the whole process so easy. The inside looks spotless and refreshed. Super convenient, professional, and high-quality work. Highly recommend!"

  - name: Ztrosper428
    stars: 5
    text: "This place is amazing! The owner was very friendly, very thorough and explained everything he was doing before he did it. He even gave me advice on how to properly care for my car and was VERY patient with my mom-mess car! I've never had my car so clean, it looks practically new (at 8 years old). Highly recommend, you can certainly tell when an owner takes pride in his work!"

  - name: Jonathan Wilson
    stars: 5
    text: "The professionalism and passion comes through in his work. Andrew took care of both my cars. One was pretty oxidized and when he was done the deep reds were back the trim all looked brand new, the interior looked stunning as well. My other SUV he brought the headlights back to life they're crystal clear again. Honestly I cannot recommend him enough."

  - name: Tim Groves
    stars: 5
    text: "Super responsive. He worked all day and didn't take a break. Everything came out looking fabulous. I would highly recommend."

  - name: ryan bozman
    stars: 5
    text: "Absolutely great experience. I appreciate the professionalism and attention to detail provided. I will definitely be back for additional services in the future."

  - name: Jean Flanders
    stars: 5
    text: "Andrew went above and beyond! Excellent customer service as well as excellent quality of work! Excellent experience for sure! Highly recommend!"

  - name: Jeremy Santiago
    stars: 5
    text: ""

  - name: Marisa Vicente
    stars: 5
    text: "Andrew was truly amazing he made my car looking like a brand new car. He took his time and make sure the job was done! Looking forward to seeing you again 😀 Thank you!"

  - name: Charles Tubbs
    stars: 5
    text: "Diamond auto came out to detail my Durango from 2002 with a tan interior recently. After he arrived on site and giving me a very fair deal on a detail, he gave me a better suggestion without changing the price making my vehicle look better than it would have if you had simply just done what I had asked. I appreciate and respect, his professional opinion no matter what as I can guarantee he will always give you the best bang for your buck to guarantee the best service possible. Thank you again!"

  - name: Brandon Sardinha
    stars: 5
    text: "I highly recommend this company. Andrew was very professional, he provided an outstanding service going above & beyond cleaning the interior of my work truck. The attention to detail in every aspect was simply outstanding, it is very hard to find someone who takes this much pride in their work! I have already scheduled another vehicle to be done."

  - name: Mark Duncan
    stars: 5
    text: "Great job"

  - name: michael wint
    stars: 5
    text: "Diamond Auto Spa did an amazing job, Andrew was super nice and easy to talk to. My truck looks great, and I'm well pleased with his leaving of expertise. I highly recommend Diamond Auto spa."

