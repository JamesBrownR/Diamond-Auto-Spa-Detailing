<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://diamondautospallc.com{{ page.url | remove: 'index.html' }}">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Diamond Auto Spa Detailing",
      "telephone": "+1-352-931-4860",
      "url": "https://diamondautospallc.com",
      "description": "Mobile auto detailing serving Lake County and Central Florida. Specializing in ceramic coatings, paint correction, and interior steam cleaning."
    }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LTX9EZGPKX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LTX9EZGPKX');
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --diamond-blue: #5BA3C7;
            --diamond-dark-blue: #4A8BA8;
            --charcoal: #000000;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            background: #000000;
            color: #ffffff;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-bottom: 1px solid #222;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .logo {
            margin: 0 2rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            text-decoration: none;
            background: linear-gradient(to right, #ffffff 50%, var(--diamond-blue) 50%);
            background-size: 200% 100%;
            background-position: 0 0;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: background-position 0.5s ease-out;
            display: inline-block;
        }

        .logo:hover { background-position: -100% 0; }

        .phone-header {
            font-size: 1.2rem;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s;
            font-family: 'Playfair Display', serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .phone-header:hover { color: var(--diamond-blue); }

        .phone-icon-svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        nav { display: contents; }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 1rem;
            transition: color 0.3s;
            font-weight: 500;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            position: relative;
        }

        nav a:hover { color: var(--diamond-blue); }

        nav a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--diamond-blue);
            bottom: -5px;
            left: 0;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease-out;
        }

        nav a:hover::after { transform: scaleX(1); }

        @media (max-width: 769px) {
            .phone-header { display: none; }
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            margin-top: 70px;
            background: #111111;
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            color: #666;
            border-bottom: 1px solid #222;
        }

        .breadcrumb a { color: var(--diamond-blue); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        /* ===== HERO ===== */
        .area-hero {
            position: relative !important;
            height: 70vh;
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 9rem 2rem 6rem;
            overflow: hidden;
            background: none !important;
        }

        .area-hero-bg {
            position: absolute;
            inset: 0;
            background-image: url('{{ site.baseurl }}/Pics/leesburg-fl-auto-detailing.webp');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        .area-hero-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.75) 50%, rgba(0,0,0,1) 100%);
            z-index: 1;
        }

        .area-hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(91,163,199,0.12) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 2;
        }

        /* ===== HERO FADE-UP ANIMATIONS (imported from service pages) ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .area-hero-eyebrow {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--diamond-blue);
            margin-bottom: 1.2rem;
            position: relative;
            z-index: 2;
            opacity: 0;
            animation: fadeUp 0.7s 0.1s ease forwards;
        }

        .area-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.7s 0.25s ease forwards;
        }

        .area-hero p {
            font-size: 1.2rem;
            color: #888888;
            max-width: 560px;
            margin: 0 auto 2.5rem;
            position: relative;
            z-index: 2;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            line-height: 1.7;
            opacity: 0;
            animation: fadeUp 0.7s 0.4s ease forwards;
        }

        .area-hero .cta-bbutton {
            position: relative;
            z-index: 2;
            opacity: 0;
            animation: fadeUp 0.7s 0.55s ease forwards;
        }

        /* ===== SECTION BANDS ===== */
        .section-dark  { background: #000000; padding: 5rem 2rem; }
        .section-light {
            background: #0d0d0d;
            padding: 5rem 2rem;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
        }

        .section-inner { max-width: 1100px; margin: 0 auto; }

        .section-inner h2,
        .area-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 1.2rem;
            color: #ffffff;
            position: relative;
            padding-bottom: 1rem;
        }

        .section-inner h2::after,
        .area-content h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--diamond-blue);
        }

        .section-inner p,
        .area-content p {
            font-size: 1.05rem;
            line-height: 1.85;
            color: #999999;
            margin-bottom: 1.5rem;
        }

        /* ===== LEGACY SINGLE-COLUMN CONTENT WRAPPER ===== */
        .area-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 5rem 2rem;
        }

        .area-section { margin: 4rem 0; }

        /* ===== INTRO SPLIT (text + image) ===== */
        .intro-split {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 4rem;
            align-items: start;
        }

        .intro-split-img img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            display: block;
            border: 1px solid #1a1a1a;
        }

        .intro-split-img figcaption {
            font-size: 0.78rem;
            color: #444;
            text-align: center;
            margin: 0.4rem 0 0;
            font-style: italic;
        }

        @media (max-width: 900px) {
            .intro-split { grid-template-columns: 1fr; gap: 2.5rem; }
            .intro-split-img { order: -1; }
        }

        /* ===== SERVICES GRID ===== */
        .services-grid-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            margin: 2.5rem 0;
            border: 1px solid #1a1a1a;
        }

        @media (max-width: 860px) { .services-grid-area { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 540px) { .services-grid-area { grid-template-columns: 1fr; } }

        .service-card-area {
            background: #080808;
            border-left: 3px solid var(--diamond-blue);
            padding: 2rem 1.8rem 2rem 2.2rem;
            transition: background 0.25s;
        }

        .section-light .service-card-area { background: #111; }
        .service-card-area:hover { background: #141414; }

        .service-card-area h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .service-card-area p { font-size: 0.93rem; color: #777; margin: 0; line-height: 1.7; }

        /* ===== WHY GRID ===== */
        .why-grid-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            margin: 2.5rem 0;
            border: 1px solid #1a1a1a;
        }

        @media (max-width: 860px) { .why-grid-area { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 540px) { .why-grid-area { grid-template-columns: 1fr; } }

        .why-card {
            padding: 2.2rem 1.8rem;
            background: #080808;
            border-top: 2px solid var(--diamond-blue);
            transition: background 0.25s;
        }

        .section-light .why-card { background: #111; }
        .why-card:hover { background: #141414; }

        .why-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--diamond-blue);
        }

        .why-card p { font-size: 0.93rem; color: #777; margin: 0; line-height: 1.7; }

        /* ===== TESTIMONIALS ===== */
        .testimonials-area {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2.5rem 0;
        }

        .testimonial-card {
            background: #080808;
            border: 1px solid #1a1a1a;
            border-left: 3px solid var(--diamond-blue);
            padding: 2rem;
        }

        .section-light .testimonial-card { background: #111; }

        .testimonial-card p {
            font-style: italic;
            color: #aaa;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .testimonial-card span {
            font-weight: 700;
            color: var(--diamond-blue);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== FAQ ACCORDION ===== */
        .faq-list {
            margin: 2rem 0;
            border: 1px solid #1a1a1a;
        }

        .faq-item {
            border-bottom: 1px solid #1a1a1a;
            background: #080808;
        }

        .section-light .faq-item { background: #111; }
        .faq-item:last-child { border-bottom: none; }

        .faq-question {
            width: 100%;
            background: none;
            border: none;
            padding: 1.4rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
            gap: 1rem;
            transition: background 0.2s;
        }

        .faq-question:hover { background: #111; }

        .faq-question span:first-child {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            color: #fff;
            font-weight: 600;
        }

        .faq-icon {
            color: var(--diamond-blue);
            font-size: 1.5rem;
            flex-shrink: 0;
            line-height: 1;
            transition: transform 0.3s;
            font-weight: 300;
        }

        .faq-item.open .faq-icon { transform: rotate(45deg); }

        .faq-answer {
            display: none;
            padding: 0 2rem 1.5rem;
            color: #888;
            font-size: 0.98rem;
            line-height: 1.8;
        }

        .faq-answer a { color: var(--diamond-blue); }
        .faq-item.open .faq-answer { display: block; }

        /* ===== NEARBY GRID ===== */
        .nearby-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            margin: 2.5rem 0;
            border: 1px solid #1a1a1a;
        }

        @media (max-width: 860px) { .nearby-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 540px) { .nearby-grid { grid-template-columns: 1fr; } }

        .nearby-card {
            background: #080808;
            padding: 1.6rem 1.8rem;
            border-left: 3px solid #1a1a1a;
            transition: background 0.25s, border-color 0.25s;
        }

        .section-light .nearby-card { background: #111; }
        .nearby-card:hover { background: #131313; border-left-color: var(--diamond-blue); }

        .nearby-card a {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: #fff;
            text-decoration: none;
            display: block;
            margin-bottom: 0.35rem;
            transition: color 0.25s;
        }

        .nearby-card:hover a { color: var(--diamond-blue); }
        .nearby-card p { font-size: 0.85rem; color: #555; margin: 0; line-height: 1.5; }

        /* ===== BOOK CTA ===== */
        .area-book-cta {
            background: #080808;
            border: 1px solid #1a1a1a;
            border-left: 4px solid var(--diamond-blue);
            padding: 2.5rem;
            margin: 3rem 0 0;
        }

        .section-light .area-book-cta { background: #111; }
        .area-book-cta p { margin-bottom: 1rem; font-size: 1.05rem; color: #aaa; }

        .phone-cta {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--diamond-blue);
            text-decoration: none;
            font-weight: 700;
            display: block;
            margin-bottom: 1.2rem;
            transition: color 0.3s;
        }

        .phone-cta:hover { color: #fff; }

        /* ===== BUTTONS ===== */
        .cta-bbutton {
            display: inline-block;
            padding: 0.9rem 2.4rem;
            background: transparent;
            border: 2px solid #fff;
            color: #fff !important;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Playfair Display', serif;
            transition: all 0.3s;
            border-radius: 2px;
            cursor: pointer;
        }

        .cta-bbutton:hover { background: #fff; color: #000 !important; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .area-hero h1 { font-size: 2.2rem; }
            .area-content { padding: 3rem 1.5rem; }
            .header-content { gap: 0.5rem; }
            .section-dark, .section-light { padding: 3.5rem 1.5rem; }
        }

        /* ===== FOOTER ===== */
        footer {
            background: #000000;
            border-top: 1px solid #111;
            color: #444;
            text-align: center;
            padding: 2rem;
        }

        footer p { margin: 0.4rem 0; font-size: 0.9rem; }
        footer a { color: var(--diamond-blue); text-decoration: none; }
        /* ===== FOOTER CTA BAND ===== */
.footer-cta-band {
    background: #0a0a0a;
    border-top: 1px solid #1a1a1a;
    padding: 6rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.footer-cta-band::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(91,163,199,0.12) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
}
.footer-cta-band h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    color: #ffffff;
    margin-bottom: 0.8rem;
    position: relative;
    z-index: 1;
}
.footer-cta-band p {
    font-size: 1.1rem;
    color: #888888;
    margin-bottom: 2.5rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    position: relative;
    z-index: 1;
}
.footer-cta-band .cta-bbutton {
    margin: 0.4rem;
    position: relative;
    z-index: 1;
}
    </style>
</head>
<body>

{% include header.html %}

<!-- ===== PAGE CONTENT ===== -->
{{ content }}

{% include footer.html %}

<script>
    // FAQ accordion
    document.querySelectorAll('.faq-question').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var item = this.closest('.faq-item');
            item.classList.toggle('open');
        });
    });
</script>

</body>
</html>
