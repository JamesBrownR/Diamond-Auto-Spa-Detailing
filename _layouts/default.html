<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    /* Subpage-specific styles */
    body { overflow-x: hidden; background: #ffffff; }

    .subpage-hero {
        background: #000000;
        color: #ffffff;
        padding: 8rem 2rem 5rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    .subpage-hero::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: radial-gradient(rgba(91,163,199,0.15) 1px, transparent 1px);
        background-size: 20px 20px;
    }
    .subpage-hero h1 {
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        margin-bottom: 1rem;
        position: relative;
        z-index: 2;
    }
    .subpage-hero p {
        font-size: 1.3rem;
        color: #aaaaaa;
        max-width: 600px;
        margin: 0 auto 2rem auto;
        position: relative;
        z-index: 2;
        font-family: 'Playfair Display', serif;
        font-style: italic;
    }
    .subpage-hero .cta-bbutton {
        position: relative;
        z-index: 2;
    }
    .subpage-content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 4rem 2rem;
    }
    .subpage-content h2 {
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem;
        margin-bottom: 1rem;
        color: #000000;
    }
    .subpage-content p {
        font-size: 1.1rem;
        line-height: 1.8;
        color: #333;
        margin-bottom: 1.5rem;
    }
    .services-grid-sub {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem;
        margin: 3rem 0;
    }
    .service-card-sub {
        background: #f8f9fa;
        border-left: 4px solid #5BA3C7;
        padding: 2rem;
        border-radius: 0 8px 8px 0;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .service-card-sub:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .service-card-sub h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.4rem;
        margin-bottom: 0.5rem;
        color: #000;
    }
    .service-card-sub p {
        font-size: 1rem;
        color: #555;
        margin: 0;
    }
    .cta-section-sub {
        background: #000000;
        color: #ffffff;
        padding: 4rem 2rem;
        text-align: center;
    }
    .cta-section-sub h2 {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        margin-bottom: 1rem;
    }
    .cta-section-sub p {
        font-size: 1.2rem;
        color: #aaa;
        margin-bottom: 2rem;
        font-family: 'Playfair Display', serif;
        font-style: italic;
    }
    .why-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 2rem;
        margin: 3rem 0;
        text-align: center;
    }
    .why-item {
        padding: 2rem 1rem;
    }
    .why-icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
    }
    .why-item h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
    }
    .breadcrumb {
        background: #f0f2f5;
        padding: 0.8rem 2rem;
        font-size: 0.9rem;
        color: #666;
    }
    .breadcrumb a { color: #5BA3C7; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
        .subpage-hero h1 { font-size: 2rem; }
    }
    </style>
</head>
