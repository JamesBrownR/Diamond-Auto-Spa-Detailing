<!-- ── LIGHTBOX ── -->
<div class="lb-overlay" id="lb" onclick="closeLbOnOverlay(event)">
  <span class="lb-close" onclick="closeLb()">&times;</span>
  <span class="lb-prev" onclick="lbNav(-1)">&#8249;</span>
  <img id="lbImg" src="" alt="">
  <span class="lb-next" onclick="lbNav(1)">&#8250;</span>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
  // ── BEFORE / AFTER SLIDERS ──
  document.querySelectorAll('[data-ba]').forEach(wrap => {
    const before  = wrap.querySelector('.ba-before');
    const divider = wrap.querySelector('.ba-divider');
    const handle  = wrap.querySelector('.ba-handle');
    let dragging  = false;

    function setPos(x) {
      const rect = wrap.getBoundingClientRect();
      let pct = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
      before.style.clipPath = `inset(0 ${(1 - pct) * 100}% 0 0)`;
      divider.style.left = handle.style.left = (pct * 100) + '%';
    }

    wrap.addEventListener('mousedown',  e => { dragging = true; setPos(e.clientX); });
    wrap.addEventListener('touchstart', e => { dragging = true; setPos(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('mousemove', e => { if (dragging) setPos(e.clientX); });
    window.addEventListener('touchmove', e => { if (dragging) setPos(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('mouseup',   () => { dragging = false; });
    window.addEventListener('touchend',  () => { dragging = false; });
  });

  // ── VIDEO AUTOPLAY ON SCROLL ──
  const vItems = document.querySelectorAll('.video-item');
  const vObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const vid  = e.target.querySelector('video');
      const icon = e.target.querySelector('.video-play-icon');
      if (e.isIntersecting) {
        vid.play().catch(() => {});
        if (icon) icon.style.opacity = '0';
      } else {
        vid.pause();
        if (icon) icon.style.opacity = '1';
      }
    });
  }, { threshold: 0.4 });
  vItems.forEach(v => vObs.observe(v));

  // ── LIGHTBOX — array built from gallery.yml at Jekyll build time ──
  const lbSrcs = [
    {% for photo in site.data.gallery %}
    { src: "{{ site.baseurl }}{{ photo.path }}", alt: "{{ photo.alt }}" }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  let lbIdx = 0;
  const lb        = document.getElementById('lb');
  const lbImg     = document.getElementById('lbImg');
  const lbCounter = document.getElementById('lbCounter');

  function openLb(i) {
    lbIdx = i;
    lbImg.src = lbSrcs[i].src;
    lbImg.alt = lbSrcs[i].alt;
    lbCounter.textContent = (i + 1) + ' / ' + lbSrcs.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  function closeLbOnOverlay(e) {
    if (e.target === lb) closeLb();
  }
  function lbNav(dir) {
    lbIdx = (lbIdx + dir + lbSrcs.length) % lbSrcs.length;
    lbImg.src = lbSrcs[lbIdx].src;
    lbImg.alt = lbSrcs[lbIdx].alt;
    lbCounter.textContent = (lbIdx + 1) + ' / ' + lbSrcs.length;
  }
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'ArrowRight') lbNav(1);
    if (e.key === 'ArrowLeft')  lbNav(-1);
    if (e.key === 'Escape')     closeLb();
  });

  // ── SHOW MORE / LESS ──
  const extraPhotos  = document.querySelectorAll('.photo-item.extra-photo');
  const showMoreBtn  = document.getElementById('showMoreBtn');
  const showLessBtn  = document.getElementById('showLessBtn');

  showMoreBtn.addEventListener('click', () => {
    extraPhotos.forEach(p => p.classList.add('visible'));
    showMoreBtn.classList.add('hidden');
    showLessBtn.classList.remove('hidden');
  });

  showLessBtn.addEventListener('click', () => {
    extraPhotos.forEach(p => p.classList.remove('visible'));
    showLessBtn.classList.add('hidden');
    showMoreBtn.classList.remove('hidden');
    document.querySelector('.g-section:last-of-type').scrollIntoView({ behavior: 'smooth' });
  });
</script>
